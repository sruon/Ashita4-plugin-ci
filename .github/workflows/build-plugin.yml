name: build-plugin

on:
  workflow_call:
    inputs:
      targets:
        description: CMake targets to build, space separated
        type: string
        required: true
      output-dir-variable:
        description: CMake variable for the output directory, set to out/
        type: string
        default: ''
      artifact-path:
        description: Files to upload
        type: string
        default: out/*.dll
      artifact-name:
        description: Artifact name, defaults to the repository name
        type: string
        default: ''
      cmake-args:
        description: Extra CMake configure arguments, space separated
        type: string
        default: ''
      build-type:
        type: string
        default: Release
      submodules:
        description: Passed to actions/checkout (false, true or recursive)
        type: string
        default: 'false'
      sdk-repository:
        type: string
        default: AshitaXI/Ashita-v4beta
      sdk-ref:
        description: Tag or branch of the SDK repository
        type: string
        default: v4.3.1.1
      clang-format:
        description: Check formatting with clang-format
        type: boolean
        default: true
      clang-format-version:
        description: clang-format version from PyPI
        type: string
        default: 22.1.4
      release-tag:
        description: Attach the DLL to this release
        type: string
        default: ''

permissions:
  contents: read

jobs:
  format:
    if: inputs.clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Check formatting
        env:
          CLANG_FORMAT_VERSION: ${{ inputs.clang-format-version }}
        run: |
          pip install "clang-format==$CLANG_FORMAT_VERSION"
          git ls-files -z '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' | xargs -0 -r clang-format --dry-run --Werror

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules }}

      - name: Fetch the Ashita SDK
        shell: bash
        env:
          SDK_REPOSITORY: ${{ inputs.sdk-repository }}
          SDK_REF: ${{ inputs.sdk-ref }}
        run: |
          sdk="$(cygpath -m "$RUNNER_TEMP")/ashita"
          git clone --filter=blob:none --no-checkout --depth 1 --branch "$SDK_REF" "https://github.com/$SDK_REPOSITORY.git" "$sdk"
          git -C "$sdk" sparse-checkout set plugins/sdk
          git -C "$sdk" checkout
          echo "ASHITA4_SDK_PATH=$sdk/plugins/sdk" >> "$GITHUB_ENV"

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x86

      # pwsh, git bash's link.exe shadows MSVC's
      - name: Configure
        shell: pwsh
        env:
          BUILD_TYPE: ${{ inputs.build-type }}
          OUTPUT_DIR_VARIABLE: ${{ inputs.output-dir-variable }}
          CMAKE_ARGS: ${{ inputs.cmake-args }}
        run: |
          $arguments = @('-S', '.', '-B', 'build', '-G', 'Ninja', "-DCMAKE_BUILD_TYPE=$env:BUILD_TYPE")
          if ($env:OUTPUT_DIR_VARIABLE) {
            $arguments += "-D$($env:OUTPUT_DIR_VARIABLE)=$("$env:GITHUB_WORKSPACE/out" -replace '\\', '/')"
          }
          $arguments += $env:CMAKE_ARGS -split ' ' | Where-Object { $_ }
          cmake @arguments
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          cmake --build build --target ($env:TARGETS -split ' ' | Where-Object { $_ })
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact-name || github.event.repository.name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error

  release:
    needs: [format, build]
    if: ${{ !cancelled() && inputs.release-tag != '' && needs.build.result == 'success' && needs.format.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact-name || github.event.repository.name }}
          path: dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
