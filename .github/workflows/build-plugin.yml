name: build-plugin

on:
  workflow_call:
    inputs:
      targets:
        description: CMake targets to build, space separated
        type: string
        required: true
      output-dir-variable:
        description: CMake variable for the output directory, set to out/
        type: string
        default: ''
      artifact-path:
        description: Files to upload
        type: string
        default: out/*.dll
      artifact-name:
        description: Artifact name, defaults to the repository name
        type: string
        default: ''
      cmake-args:
        description: Extra CMake configure arguments, space separated
        type: string
        default: ''
      build-type:
        type: string
        default: Release
      submodules:
        description: Passed to actions/checkout (false, true or recursive)
        type: string
        default: 'false'
      sdk-repository:
        type: string
        default: AshitaXI/Ashita-v4beta
      sdk-ref:
        description: Tag or branch of the SDK repository
        type: string
        default: v4.3.1.1
      clang-format:
        description: Check formatting with clang-format
        type: boolean
        default: true
      clang-format-version:
        description: clang-format version from PyPI
        type: string
        default: 22.1.4
      release-tag:
        description: Attach a zip of the DLL to this release
        type: string
        default: ''
      install-dir:
        description: Folder under Ashita's root the DLL goes in, plugins or polplugins
        type: string
        default: plugins

permissions:
  contents: read

jobs:
  format:
    if: inputs.clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Check formatting
        env:
          CLANG_FORMAT_VERSION: ${{ inputs.clang-format-version }}
        run: |
          pip install "clang-format==$CLANG_FORMAT_VERSION"
          git ls-files -z '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' | xargs -0 -r clang-format --dry-run --Werror

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules }}

      - name: Fetch the Ashita SDK
        shell: bash
        env:
          SDK_REPOSITORY: ${{ inputs.sdk-repository }}
          SDK_REF: ${{ inputs.sdk-ref }}
        run: |
          sdk="$(cygpath -m "$RUNNER_TEMP")/ashita"
          git clone --filter=blob:none --no-checkout --depth 1 --branch "$SDK_REF" "https://github.com/$SDK_REPOSITORY.git" "$sdk"
          git -C "$sdk" sparse-checkout set plugins/sdk
          git -C "$sdk" checkout
          echo "ASHITA4_SDK_PATH=$sdk/plugins/sdk" >> "$GITHUB_ENV"

      - name: Load MSVC x86
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars32.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV
            }
          }

      # pwsh, git bash's link.exe shadows MSVC's
      - name: Configure
        shell: pwsh
        env:
          BUILD_TYPE: ${{ inputs.build-type }}
          OUTPUT_DIR_VARIABLE: ${{ inputs.output-dir-variable }}
          CMAKE_ARGS: ${{ inputs.cmake-args }}
        run: |
          $arguments = @('-S', '.', '-B', 'build', '-G', 'Ninja', "-DCMAKE_BUILD_TYPE=$env:BUILD_TYPE")
          if ($env:OUTPUT_DIR_VARIABLE) {
            $arguments += "-D$($env:OUTPUT_DIR_VARIABLE)=$("$env:GITHUB_WORKSPACE/out" -replace '\\', '/')"
          }
          $arguments += $env:CMAKE_ARGS -split ' ' | Where-Object { $_ }
          cmake @arguments
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          cmake --build build --target ($env:TARGETS -split ' ' | Where-Object { $_ })
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name || github.event.repository.name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error

  release:
    needs: [format, build]
    if: ${{ !cancelled() && inputs.release-tag != '' && needs.build.result == 'success' && needs.format.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name || github.event.repository.name }}
          path: package/${{ inputs.install-dir }}

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          (cd package && zip -r "../$RELEASE_TAG.zip" .)
          gh release upload "$RELEASE_TAG" "$RELEASE_TAG.zip" --clobber --repo "$GITHUB_REPOSITORY"
